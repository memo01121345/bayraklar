<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Türk Bayrağı Web Display</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        /* 1280x720 Sabit Web Ekran Alanı */
        .display-container {
            width: 1280px;
            height: 720px;
            position: relative;
            background-color: #000;
            overflow: hidden;
        }
        /* Arka Plan Videosu */
        #myVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <div class="display-container">
        <!-- Boğaz Manzaralı Türk Bayrağı Videosu -->
        <video id="myVideo" autoplay loop muted playsinline preload="auto">
            <source src="https://media.istockphoto.com/id/1299704825/tr/video/t%C3%BCrk-bayra%C4%9Fi-ve-bo%C4%9Faz.mp4?s=mp4-640x640-is&k=20&c=tPO_xzfmfIKGzVjMzhXHFaQe6uUFPtoB8Sc92XbzprE=" type="video/mp4">
            Tarayıcınız video etiketini desteklemiyor.
        </video>
    </div>

    <script>
        // Tarayıcıların otomatik oynatma engellerini aşmak için tetikleyici script
        window.addEventListener('DOMContentLoaded', (event) => {
            const video = document.getElementById('myVideo');
            if (video) {
                video.muted = true; // Tarayıcı izni için mutlaka sessiz olmalı
                video.play().catch(error => {
                    console.log("Otomatik oynatma engellendi, yeniden deneniyor...", error);
                    // Kullanıcı etkileşimi olmadan oynatma başarısız olursa tekrar zorla
                    document.body.addEventListener('click', () => {
                        video.play();
                    }, { once: true });
                });
            }
        });
    </script>
</body>
</html>
