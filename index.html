<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Türk Bayrağı Web Display</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        /* 1280x720 Sabit Web Ekran Alanı */
        .display-container {
            width: 1280px;
            height: 720px;
            position: relative;
            background-color: #000;
            overflow: hidden;
        }
        /* Arka Plan Videosu */
        #myVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <div class="display-container">
        <!-- İlk İstediğiniz Yüksek Detay Türk Bayrağı Videosu -->
        <video id="myVideo" autoplay loop muted playsinline preload="auto" crossorigin="anonymous">
            <source src="https://media.istockphoto.com/id/1126429890/tr/video/y%C3%BCksek-detay-t%C3%BCrk-bayra%C4%9F%C4%B1-sorunsuz-d%C3%B6ng%C3%BC.mp4?s=mp4-640x640-is&k=20&c=RwmzNE9FA0A8v0zJ7kfmnqwm8E0wtnXQAe9HQa39w10=" type="video/mp4">
            Tarayıcınız video etiketini desteklemiyor.
        </video>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', (event) => {
            const video = document.getElementById('myVideo');
            if (video) {
                video.muted = true;
                // Tarayıcı otomatik oynatma izin kontrolü
                let playPromise = video.play();
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        console.log("Otomatik oynatma için kullanıcı etkileşimi bekleniyor...");
                        // Siyah ekranda kalmaması için ilk tıklamada videoyu başlatır
                        document.body.addEventListener('click', () => {
                            video.play();
                        }, { once: true });
                    });
                }
            }
        });
    </script>
</body>
</html>
